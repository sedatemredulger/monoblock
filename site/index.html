<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monoblock</title>
<style>
  :root{ --bg:#E9E9E7; --card:#F5F4F1; --ink:#1B1D1F; --soft:#6B6E72; --edge:#D6D4CF; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1F2225; --card:#2A2D31; --ink:#F2EFE9; --soft:#A9A59D; --edge:#3A3E43; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.7; padding:40px 18px; }
  .wrap{ max-width:680px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:30px 26px 34px; }
  h1{ font-size:28px; margin:0 0 4px; letter-spacing:-.02em; }
  .date{ color:var(--soft); font-size:14px; margin:0 0 26px; }
  h2{ font-size:18px; margin:28px 0 8px; }
  p, li{ font-size:15.5px; }
  ul{ padding-left:20px; }
  table{ border-collapse:collapse; width:100%; margin:12px 0; font-size:14.5px; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--edge); vertical-align:top; }
  th{ color:var(--soft); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .box{ border-left:3px solid var(--soft); padding:2px 0 2px 14px; margin:16px 0; color:var(--soft); }
  a{ color:inherit; }
  code{ font-size:.92em; }
  footer{ color:var(--soft); font-size:13.5px; margin-top:30px; }
  .links a{ display:block; padding:14px 16px; margin:10px 0; border:1px solid var(--edge);
    border-radius:12px; text-decoration:none; font-weight:600; }
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Monoblock</h1>
<p class="date">Block puzzle with no clock — fit, clear, repeat.</p>
<p>A mobile game by <strong>Düka Games</strong>.</p>
<div class="links">
  <a href="privacy.html">Privacy Policy (English)</a>
  <a href="gizlilik.html">Gizlilik Politikası (Türkçe)</a>
</div>
<footer>Contact: <a href="mailto:dukagames.support@gmail.com">dukagames.support@gmail.com</a></footer>
</div></div></body></html>
